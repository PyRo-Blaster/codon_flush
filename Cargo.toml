[package]
name = "codon_harmony"
version = "2.0.0"
edition = "2021"
description = "Codon optimization: host-profile-exact composition plus constraint-repairing arrangement"
authors = ["Codon Harmony Team"]
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
rayon = "=1.8.1"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }

[profile.release]
opt-level = 3
lto = true

[lib]
name = "codon_harmony_core"
path = "src/lib.rs"

[[bin]]
name = "codon_harmony"
path = "src/main.rs"
