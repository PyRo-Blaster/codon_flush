# The Rust engine's checks. Pinned to 1.73, which is what the project targets: the
# dependency versions in Cargo.toml are held back for it, and clippy's newer lints
# suggest std methods (Option::is_none_or among them) that 1.73 does not have, so a
# floating toolchain would fail the build on advice the project cannot take.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.73
        run: |
          rustup toolchain install 1.73.0 --profile minimal --component clippy
          rustup default 1.73.0
          rustc --version

      # The auditor is standard library only, but pytest is not, and a system
      # Python on a runner may refuse to install into itself.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.73.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.73.0-

      # --locked, because the pins are the point: a resolver that quietly upgrades
      # rayon or half breaks the build on this toolchain.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Release, because the search is the slow part and a debug suite takes minutes.
      - name: Test
        run: cargo test --locked --release

      # The auditor exists to stop the engine certifying its own output, so its
      # negative tests belong here. It is pure standard library on purpose: it used
      # to need Biopython < 1.78, which is why it could not run in CI at all.
      - name: Audit tests
        run: |
          pip install --quiet pytest
          pytest tests/test_validate_audit.py -q

      # And the auditor itself, against real output, so a release that passes the
      # Rust suite but writes a gene that fails an independent check still fails.
      - name: Audit real output
        run: |
          cargo build --locked --release --bin codon_harmony
          printf '>gfp\n%s\n' "$(sed -n 's/^pub const GFP: &str = "\(.*\)";$/\1/p' src/testdata.rs)" > /tmp/proteins.fasta
          ./target/release/codon_harmony \
            --input /tmp/proteins.fasta --output /tmp/genes.fasta \
            --host-table tests/data/e_coli_316407.json \
            --report-json /tmp/report.json --quiet
          python3 scripts/validate.py /tmp/proteins.fasta /tmp/genes.fasta \
            tests/data/e_coli_316407.json /tmp/report.json
